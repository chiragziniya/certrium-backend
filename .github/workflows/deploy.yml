name: CI / CD — Certrium Backend

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ─────────────────────────────────────────────
  # JOB 1: Run test suite
  # ─────────────────────────────────────────────
  test:
    name: Test
    runs-on: ubuntu-latest

    env:
      DJANGO_ENV: local
      SECRET_KEY: ci-insecure-key-not-used-in-prod
      DATABASE_URL: sqlite:///db.sqlite3
      TESTING: "true"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run migrations (test DB)
        run: python manage.py migrate --noinput

      - name: Run tests
        run: python manage.py test --verbosity=2

  # ─────────────────────────────────────────────
  # JOB 2: Deploy (only after tests pass, only on push to main)
  # ─────────────────────────────────────────────
  deploy:
    name: Deploy
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}

          script: |
            set -e

            cd /var/www/html/certrium/backend

            echo "Resetting repo..."
            git reset --hard
            git clean -fd
            git pull origin main

            echo "Activating venv..."
            source .venv/bin/activate

            echo "Upgrading pip..."
            pip install --upgrade pip

            echo "Installing requirements..."
            pip install -r requirements.txt

            echo "Running migrations..."
            python manage.py migrate --noinput

            echo "Collecting static files..."
            python manage.py collectstatic --noinput

            echo "Restarting services..."
            sudo systemctl restart certrium

            echo "Deployment successful"